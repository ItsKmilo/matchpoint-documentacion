<text x="1162.0" y="1442" font-family="Arial, Liberation Sans, sans-serif" font-size="25" fill="#10284A" font-weight="bold" text-anchor="start">Ajustar créditos autorizados</text>
<text x="1162.0" y="1481" font-family="Arial, Liberation Sans, sans-serif" font-size="19" fill="#4E4D43" font-weight="normal" text-anchor="start">Quiero registrar ajustes de créditos justificados para corregir saldos de forma trazable.</text>
<line x1="1162.0" y1="1508" x2="2150.0" y2="1508" stroke="#E6CA68" stroke-width="1.5"/>
<text x="1162.0" y="1532" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">Paso 1: Al seleccionar la opción «Ajustar créditos» en el detalle de un participante, el sistema deberá mostrar el</text>
<text x="1162.0" y="1555" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">formulario con tipo (abono o cargo), cantidad y motivo obligatorio.</text>
<text x="1162.0" y="1640" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#8D7332" font-weight="bold" text-anchor="start">5 SP · Camilo B.</text>
<text x="2150.0" y="1640" font-family="Arial, Liberation Sans, sans-serif" font-size="16" fill="#A08A4A" font-weight="normal" text-anchor="end">Mockup HU017</text>
