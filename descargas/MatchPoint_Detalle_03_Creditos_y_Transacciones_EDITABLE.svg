<g id="HU009" data-story-id="HU009" data-sprint="1">
<rect x="90.0" y="935" width="1028.0" height="300" rx="13" fill="#FFF1AD" stroke="#E6CA68" stroke-width="2"/>
<rect x="104.0" y="948" width="104" height="35" rx="7" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="113.0" y="973" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#7C6B39" font-weight="bold" text-anchor="start">HU009</text>
<text x="1097.0" y="975" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#8D7332" font-weight="bold" text-anchor="end">S1 · Must</text>
<text x="110.0" y="1017" font-family="Arial, Liberation Sans, sans-serif" font-size="25" fill="#10284A" font-weight="bold" text-anchor="start">Asignar créditos iniciales</text>
<text x="110.0" y="1056" font-family="Arial, Liberation Sans, sans-serif" font-size="19" fill="#4E4D43" font-weight="normal" text-anchor="start">Quiero que cada participante reciba automáticamente su saldo inicial de créditos virtuales para que pueda</text>
<text x="110.0" y="1081" font-family="Arial, Liberation Sans, sans-serif" font-size="19" fill="#4E4D43" font-weight="normal" text-anchor="start">participar desde su registro.</text>
<line x1="110.0" y1="1108" x2="1098.0" y2="1108" stroke="#E6CA68" stroke-width="1.5"/>
<text x="110.0" y="1132" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">Paso 1: Al registrar un nuevo participante (HU002), el sistema deberá asignarle automáticamente el saldo inicial</text>
<text x="110.0" y="1155" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">configurado (por ejemplo, 1.000 créditos).</text>
<text x="110.0" y="1215" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#8D7332" font-weight="bold" text-anchor="start">3 SP · Camilo B.</text>
<text x="1098.0" y="1215" font-family="Arial, Liberation Sans, sans-serif" font-size="16" fill="#A08A4A" font-weight="normal" text-anchor="end">Mockup HU009</text>
</g>
<g id="HU010" data-story-id="HU010" data-sprint="1">
<rect x="1142.0" y="935" width="1028.0" height="300" rx="13" fill="#FFF1AD" stroke="#E6CA68" stroke-width="2"/>
<rect x="1156.0" y="948" width="104" height="35" rx="7" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="1165.0" y="973" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#7C6B39" font-weight="bold" text-anchor="start">HU010</text>
<text x="2149.0" y="975" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#8D7332" font-weight="bold" text-anchor="end">S1 · Must</text>
<text x="1162.0" y="1017" font-family="Arial, Liberation Sans, sans-serif" font-size="25" fill="#10284A" font-weight="bold" text-anchor="start">Consultar saldo y movimientos</text>
<text x="1162.0" y="1056" font-family="Arial, Liberation Sans, sans-serif" font-size="19" fill="#4E4D43" font-weight="normal" text-anchor="start">Quiero consultar mi saldo y mis movimientos de créditos para verificar cada descuento y cada premio.</text>
<line x1="1162.0" y1="1083" x2="2150.0" y2="1083" stroke="#E6CA68" stroke-width="1.5"/>
<text x="1162.0" y="1107" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">Paso 1: Al seleccionar la opción «Mis créditos», el sistema deberá mostrar el saldo disponible actualizado.</text>
<text x="1162.0" y="1215" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#8D7332" font-weight="bold" text-anchor="start">3 SP · Diego R.</text>
<text x="2150.0" y="1215" font-family="Arial, Liberation Sans, sans-serif" font-size="16" fill="#A08A4A" font-weight="normal" text-anchor="end">Mockup HU010</text>
