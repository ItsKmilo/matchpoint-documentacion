<rect x="90.0" y="482" width="2080.0" height="160" rx="14" fill="#BDF0D5" stroke="#6FCB9B" stroke-width="2"/>
<text x="108.0" y="521" font-family="Arial, Liberation Sans, sans-serif" font-size="21" fill="#146746" font-weight="bold" text-anchor="start">ÉPICA 03</text>
<text x="108.0" y="568" font-family="Arial, Liberation Sans, sans-serif" font-size="32" fill="#163153" font-weight="bold" text-anchor="start">Pronósticos</text>
<text x="108.0" y="610" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#146746" font-weight="normal" text-anchor="start">Para participar dentro del plazo y conservar evidencia de cada elección.</text>
