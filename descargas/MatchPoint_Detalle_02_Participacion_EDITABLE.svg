<g id="HU007" data-story-id="HU007" data-sprint="1">
<rect x="90.0" y="935" width="1028.0" height="300" rx="13" fill="#FFF1AD" stroke="#E6CA68" stroke-width="2"/>
<rect x="104.0" y="948" width="104" height="35" rx="7" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="113.0" y="973" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#7C6B39" font-weight="bold" text-anchor="start">HU007</text>
<text x="1097.0" y="975" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#8D7332" font-weight="bold" text-anchor="end">S1 · Must</text>
<text x="110.0" y="1017" font-family="Arial, Liberation Sans, sans-serif" font-size="25" fill="#10284A" font-weight="bold" text-anchor="start">Consultar torneos y eventos</text>
<text x="110.0" y="1056" font-family="Arial, Liberation Sans, sans-serif" font-size="19" fill="#4E4D43" font-weight="normal" text-anchor="start">Quiero consultar los torneos activos y sus eventos para conocer en qué puedo pronosticar, hasta cuándo y con</text>
<text x="110.0" y="1081" font-family="Arial, Liberation Sans, sans-serif" font-size="19" fill="#4E4D43" font-weight="normal" text-anchor="start">qué costo.</text>
<line x1="110.0" y1="1108" x2="1098.0" y2="1108" stroke="#E6CA68" stroke-width="1.5"/>
<text x="110.0" y="1132" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">Paso 1: Al ingresar al panel de participante, el sistema deberá mostrar la lista de torneos activos con nombre,</text>
<text x="110.0" y="1155" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">deporte y fechas.</text>
<text x="110.0" y="1215" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#8D7332" font-weight="bold" text-anchor="start">3 SP · Diego R.</text>
<text x="1098.0" y="1215" font-family="Arial, Liberation Sans, sans-serif" font-size="16" fill="#A08A4A" font-weight="normal" text-anchor="end">Mockup HU007</text>
</g>
<g id="HU008" data-story-id="HU008" data-sprint="1">
<rect x="1142.0" y="935" width="1028.0" height="300" rx="13" fill="#FFF1AD" stroke="#E6CA68" stroke-width="2"/>
<rect x="1156.0" y="948" width="104" height="35" rx="7" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="1165.0" y="973" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#7C6B39" font-weight="bold" text-anchor="start">HU008</text>
<text x="2149.0" y="975" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#8D7332" font-weight="bold" text-anchor="end">S1 · Must</text>
<text x="1162.0" y="1017" font-family="Arial, Liberation Sans, sans-serif" font-size="25" fill="#10284A" font-weight="bold" text-anchor="start">Registrar pronóstico</text>
<text x="1162.0" y="1056" font-family="Arial, Liberation Sans, sans-serif" font-size="19" fill="#4E4D43" font-weight="normal" text-anchor="start">Quiero registrar un pronóstico en un evento abierto para participar usando mis créditos virtuales.</text>
<line x1="1162.0" y1="1083" x2="2150.0" y2="1083" stroke="#E6CA68" stroke-width="1.5"/>
<text x="1162.0" y="1107" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">Paso 1: Al seleccionar la opción «Pronosticar» en un evento abierto, el sistema deberá mostrar las opciones válidas, el</text>
<text x="1162.0" y="1130" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">costo en créditos y el saldo disponible.</text>
<text x="1162.0" y="1215" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#8D7332" font-weight="bold" text-anchor="start">8 SP · Maicol R.</text>
<text x="2150.0" y="1215" font-family="Arial, Liberation Sans, sans-serif" font-size="16" fill="#A08A4A" font-weight="normal" text-anchor="end">Mockup HU008</text>
</g>
