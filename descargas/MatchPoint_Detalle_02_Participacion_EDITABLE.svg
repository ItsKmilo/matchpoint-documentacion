<text x="121" y="2096" font-family="Arial, Liberation Sans, sans-serif" font-size="24" fill="#10284A" font-weight="bold" text-anchor="start">Paso a paso completo y mockup de cada historia: Product Backlog (web, PDF y Excel).</text>
