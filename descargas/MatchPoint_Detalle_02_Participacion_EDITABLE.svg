<rect x="1156.0" y="712" width="1000.0" height="82" rx="8" fill="#DACDFF" stroke="#C6B8F2" stroke-width="1"/>
<text x="1170.0" y="760" font-family="Arial, Liberation Sans, sans-serif" font-size="26" fill="#3F3470" font-weight="bold" text-anchor="start">Pronosticar y seguir</text>
