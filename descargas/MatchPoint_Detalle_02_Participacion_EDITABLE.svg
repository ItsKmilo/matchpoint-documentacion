<g id="HU011" data-story-id="HU011" data-sprint="2">
<rect x="1142.0" y="1360" width="1028.0" height="300" rx="13" fill="#FFF1AD" stroke="#E6CA68" stroke-width="2"/>
<rect x="1156.0" y="1373" width="104" height="35" rx="7" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="1165.0" y="1398" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#7C6B39" font-weight="bold" text-anchor="start">HU011</text>
<text x="2149.0" y="1400" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#8D7332" font-weight="bold" text-anchor="end">S2 · Must</text>
<text x="1162.0" y="1442" font-family="Arial, Liberation Sans, sans-serif" font-size="25" fill="#10284A" font-weight="bold" text-anchor="start">Consultar mis pronósticos</text>
<text x="1162.0" y="1481" font-family="Arial, Liberation Sans, sans-serif" font-size="19" fill="#4E4D43" font-weight="normal" text-anchor="start">Quiero consultar mis pronósticos y su estado para saber cuáles están pendientes, cuáles acerté y qué premio</text>
<text x="1162.0" y="1506" font-family="Arial, Liberation Sans, sans-serif" font-size="19" fill="#4E4D43" font-weight="normal" text-anchor="start">recibí.</text>
<line x1="1162.0" y1="1533" x2="2150.0" y2="1533" stroke="#E6CA68" stroke-width="1.5"/>
<text x="1162.0" y="1557" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">Paso 1: Al seleccionar la opción «Mis pronósticos», el sistema deberá mostrar la lista de pronósticos del participante</text>
<text x="1162.0" y="1580" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">con torneo, evento, opción elegida, créditos y estado.</text>
<text x="1162.0" y="1640" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#8D7332" font-weight="bold" text-anchor="start">3 SP · Diego R.</text>
<text x="2150.0" y="1640" font-family="Arial, Liberation Sans, sans-serif" font-size="16" fill="#A08A4A" font-weight="normal" text-anchor="end">Mockup HU011</text>
</g>
<g id="HU012" data-story-id="HU012" data-sprint="2">
<rect x="1142.0" y="1680" width="1028.0" height="300" rx="13" fill="#FFF1AD" stroke="#E6CA68" stroke-width="2"/>
<rect x="1156.0" y="1693" width="104" height="35" rx="7" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="1165.0" y="1718" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#7C6B39" font-weight="bold" text-anchor="start">HU012</text>
<text x="2149.0" y="1720" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#8D7332" font-weight="bold" text-anchor="end">S2 · Should</text>
<text x="1162.0" y="1762" font-family="Arial, Liberation Sans, sans-serif" font-size="25" fill="#10284A" font-weight="bold" text-anchor="start">Anular pronóstico</text>
<text x="1162.0" y="1801" font-family="Arial, Liberation Sans, sans-serif" font-size="19" fill="#4E4D43" font-weight="normal" text-anchor="start">Quiero anular un pronóstico antes de la fecha límite para recuperar mis créditos si cambio de decisión, siempre</text>
<text x="1162.0" y="1826" font-family="Arial, Liberation Sans, sans-serif" font-size="19" fill="#4E4D43" font-weight="normal" text-anchor="start">y cuando el evento siga abierto.</text>
<line x1="1162.0" y1="1853" x2="2150.0" y2="1853" stroke="#E6CA68" stroke-width="1.5"/>
<text x="1162.0" y="1877" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">Paso 1: Al seleccionar la opción «Anular» en un pronóstico pendiente, el sistema deberá validar si el evento sigue</text>
<text x="1162.0" y="1900" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#5C6248" font-weight="normal" text-anchor="start">abierto.</text>
<text x="1162.0" y="1960" font-family="Arial, Liberation Sans, sans-serif" font-size="18" fill="#8D7332" font-weight="bold" text-anchor="start">5 SP · Maicol R.</text>
<text x="2150.0" y="1960" font-family="Arial, Liberation Sans, sans-serif" font-size="16" fill="#A08A4A" font-weight="normal" text-anchor="end">Mockup HU012</text>
</g>
